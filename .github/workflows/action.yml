---
- name: Test SSH connection and environment
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.HOST }}
    port: ${{ secrets.PORT }}
    username: ${{ secrets.USERNAME }}
    key: ${{ secrets.KEY }}
    script: |
      whoami
      hostname
      pwd
      ls -la ./deploy-pz-scoreboard.sh || echo "script not found at relative path"
      id
      env | sort
